<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UNSOLD — advice from people with nothing to sell. Anonymous human guidance, protected by AI: a Guardian removes promotion and contact details from every message."
    />
    <meta name="theme-color" content="#0B1113" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230B1113'/%3E%3Cpath d='M9 21l7-13 7 13' stroke='%2334D399' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='9' cy='21' r='2.6' fill='%2334D399'/%3E%3Ccircle cx='16' cy='8' r='2.6' fill='%2334D399'/%3E%3Ccircle cx='23' cy='21' r='2.6' fill='%2334D399'/%3E%3C/svg%3E"
    />
    <title>UNSOLD — Advice without an agenda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("atlas.theme");
          var theme = t === "light" || t === "dark" ? t : "dark"; // dark-first
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* no storage — stay dark */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
